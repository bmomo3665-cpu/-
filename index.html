<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Библиотека">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b1809">
<title>Моя библиотека</title>
<style>
  :root {
    --gold-light: #ffeead;
    --gold: #e0ad4d;
    --gold-warm: #ffdb80;
    --ink: #f5e6c8;
    --muted: #b79d78;
    --H: 150px;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    min-height: 100%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, transparent 2px 11px),
      linear-gradient(#4d2e19, #2e1a0c);
    background-color: #2e1a0c;
  }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button { font-family: inherit; }

  /* ---------- Верхняя часть ---------- */
  .title { text-align: center; padding: 60px 64px 0; }
  .title > button { all: unset; display: block; margin: 0 auto; cursor: pointer; max-width: 100%; }
  .title > button:focus-visible { outline: 2px solid var(--gold-warm); outline-offset: 6px; border-radius: 6px; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--gold); }
  .orn i { display: block; height: 2px; width: 56px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn i:last-child { background: linear-gradient(90deg, var(--gold), transparent); }
  .orn svg { width: 16px; height: 16px; }
  h1.name {
    margin: 8px 0 6px;
    font-size: clamp(30px, 7vw, 46px);
    line-height: 1.12;
    font-style: italic; font-weight: 700;
    background: linear-gradient(#ffeead, #e0ad4d 58%, #ffdb80);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.65));
    overflow-wrap: anywhere;
  }
  .edit-hint { font-size: 12px; color: var(--muted); }

  .fab {
    position: fixed; z-index: 20;
    top: calc(env(safe-area-inset-top) + 12px);
    width: 46px; height: 46px; border-radius: 50%;
    border: 0; cursor: pointer;
    background: rgba(31,18,8,.88); color: var(--gold-light);
    display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .fab svg { width: 24px; height: 24px; }
  .fab:focus-visible { outline: 2px solid var(--gold-warm); outline-offset: 2px; }
  #addBtn { right: calc(env(safe-area-inset-right) + 14px); }
  #backupBtn { left: calc(env(safe-area-inset-left) + 14px); }

  /* ---------- Шкаф ---------- */
  .case {
    position: relative;
    width: min(900px, calc(100% - 24px));
    margin: 24px auto 70px;
    padding: 0 16px;
    background: #1f1208;
    border-radius: 6px;
    box-shadow: 0 16px 34px rgba(0,0,0,.65);
  }
  .case::before, .case::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 16px; z-index: 3;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(180deg, rgba(0,0,0,.10) 0 1px, transparent 1px 23px),
      linear-gradient(90deg, #7f4f28, #5b381a 50%, #7f4f28);
  }
  .case::before { left: 0; border-radius: 6px 0 0 6px; }
  .case::after  { right: 0; border-radius: 0 6px 6px 0; }

  .plank {
    position: relative; z-index: 2;
    height: 18px;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.07) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 37px),
      linear-gradient(#b8794a, #85522a);
    border-top: 2px solid rgba(255,255,255,.28);
    border-bottom: 2px solid rgba(0,0,0,.35);
    box-shadow: 0 3px 6px rgba(0,0,0,.55);
  }
  .plank.top { height: 16px; }

  .row {
    display: flex; align-items: flex-end; gap: 3px;
    height: 168px; padding: 0 14px;
    overflow: hidden;
    background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,0) 26%), #24150a;
  }
  .hint { margin: auto; align-self: center; color: var(--muted); font-style: italic; text-align: center; padding: 0 20px; pointer-events: none; }

  /* ---------- Корешок ---------- */
  .spine {
    flex: none;
    width: var(--w); height: var(--H);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px;
    background:
      linear-gradient(90deg, rgba(255,255,255,.2), rgba(255,255,255,0) 35%, rgba(0,0,0,.3)),
      var(--c);
    color: var(--t);
    box-shadow: 1px 0 3px rgba(0,0,0,.45);
    cursor: grab;
    touch-action: pan-y;
  }
  .spine::before, .spine::after {
    content: ""; position: absolute; left: 0; right: 0; height: 2px;
    background: currentColor; opacity: .35;
  }
  .spine::before { top: 8px; }
  .spine::after  { bottom: 8px; }
  .spine span {
    writing-mode: vertical-rl;
    max-height: calc(var(--H) - 40px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 600; font-size: var(--fs);
    pointer-events: none;
  }
  .spine.dragging { opacity: .25; }
  .spine.mark-swap { outline: 3px solid var(--gold-warm); outline-offset: -3px; }
  .spine.mark-before { box-shadow: -3px 0 0 var(--gold-warm), 1px 0 3px rgba(0,0,0,.45); }
  .spine.mark-after  { box-shadow:  3px 0 0 var(--gold-warm), 1px 0 3px rgba(0,0,0,.45); }
  .shelf.mark-row .row { outline: 2px dashed rgba(255,219,128,.6); outline-offset: -4px; }
  .ghost {
    position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none;
    box-shadow: 0 12px 24px rgba(0,0,0,.6) !important;
  }
  body.dragging-now { cursor: grabbing; }

  /* ---------- Окна ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: min(560px, 100%);
    max-height: 92vh; overflow: auto;
    background: #2b1a0d;
    border: 1px solid #5b381a;
    border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,.5);
    -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 640px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 18px; }
  }
  .sheet h2 { margin: 0 0 14px; font-size: 22px; font-weight: 700; color: var(--gold-warm); }
  .field { margin-bottom: 14px; }
  .field > label, .lbl { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
  input[type=text], input[type=date], textarea {
    width: 100%; padding: 11px 12px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: #1a0f06; border: 1px solid #6b4423; border-radius: 10px;
  }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold-warm); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 90px; }
  .check { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 16px; }
  .check input { width: 20px; height: 20px; accent-color: var(--gold); }
  .check + input[type=date] { margin-bottom: 10px; }

  .stars { display: flex; gap: 2px; }
  .stars button {
    all: unset; flex: 1; text-align: center; cursor: pointer;
    font-size: 27px; line-height: 1.3; color: #6b5a45;
  }
  .stars button.on { color: #ffcc33; }
  .stars button:focus-visible { outline: 2px solid var(--gold-warm); border-radius: 6px; }

  .colorrow { display: flex; gap: 14px; align-items: center; }
  .colorrow input[type=color] { width: 72px; height: 48px; padding: 0; border: 1px solid #6b4423; border-radius: 10px; background: #1a0f06; cursor: pointer; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }
  .preview { display: flex; align-items: flex-end; justify-content: center; height: calc(var(--H) + 8px); margin-top: 12px; padding: 4px; background: #24150a; border-bottom: 14px solid #85522a; border-radius: 6px 6px 0 0; }

  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .btn {
    all: unset; box-sizing: border-box; text-align: center; cursor: pointer;
    padding: 13px 16px; border-radius: 12px; font-size: 17px; font-weight: 600;
    border: 1px solid #6b4423; color: var(--ink);
  }
  .btn.primary { background: linear-gradient(#ffdb80, #d9a441); color: #2b1809; border-color: #ffeead; }
  .btn.primary[disabled] { opacity: .4; cursor: not-allowed; }
  .btn.danger { color: #ff9b8f; border-color: #7a3a33; }
  .btn:focus-visible { outline: 2px solid var(--gold-warm); outline-offset: 2px; }

  .detail-head { display: flex; gap: 18px; align-items: flex-end; margin-bottom: 14px; }
  .detail-head .preview { margin: 0; height: auto; padding: 4px 8px 0; border-bottom-width: 10px; }
  .detail-head h2 { margin-bottom: 4px; }
  .meta { color: var(--muted); margin: 2px 0; }
  .rate { font-size: 22px; color: #ffcc33; letter-spacing: 1px; margin: 8px 0; }
  .rate small { color: var(--ink); font-size: 18px; letter-spacing: 0; margin-left: 6px; }
  .comment { white-space: pre-wrap; border-top: 1px solid #5b381a; padding-top: 12px; margin-top: 10px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
  .note { font-size: 14px; color: var(--muted); line-height: 1.45; margin: 0 0 12px; }

  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>

<button class="fab" id="backupBtn" aria-label="Резервная копия">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
</button>
<button class="fab" id="addBtn" aria-label="Добавить книгу">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<header class="title">
  <button id="nameBtn" aria-label="Изменить название библиотеки">
    <div class="orn"><i></i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h11a2 2 0 012 2v14a2 2 0 01-2 2H6V3zm2 2v14h9V5H8z"/></svg><i></i></div>
    <h1 class="name" id="name">Моя библиотека</h1>
    <div class="edit-hint">нажмите, чтобы изменить название</div>
  </button>
</header>

<main class="case" id="case">
  <div class="plank top"></div>
</main>

<script>
(() => {
  'use strict';

  const KEY = 'bookshelf.v1';
  const state = { name: 'Моя библиотека', books: [] };

  /* ---------- Мелкие помощники ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  function h(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(c));
    }
    return e;
  }
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  const today = () => new Date().toLocaleDateString('sv-SE');
  const fmtDate = v => new Date(v + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  const isHex = c => /^#[0-9a-f]{6}$/i.test(c || '');
  const thick = p => Math.round(16 + Math.min(Math.max(p, 20), 1200) / 1200 * 48);   // 200 стр. — тонкая, 1000 — толстая
  const textColor = hex => {
    const n = parseInt(hex.slice(1), 16);
    const l = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
    return l > 0.6 ? '#111' : '#fff';
  };

  /* ---------- Сохранение: localStorage + копия в IndexedDB ---------- */
  let idb = null;
  const idbOpen = () => new Promise((res, rej) => {
    const r = indexedDB.open('bookshelf', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  async function idbGet() {
    try {
      idb = idb || await idbOpen();
      return await new Promise((res, rej) => {
        const q = idb.transaction('kv').objectStore('kv').get(KEY);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    } catch (e) { return null; }
  }
  async function idbSet(v) {
    try {
      idb = idb || await idbOpen();
      await new Promise((res, rej) => {
        const tx = idb.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, KEY);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch (e) { /* копия необязательна */ }
  }
  const snapshot = () => JSON.stringify({ v: 1, name: state.name, books: state.books });
  function save() {
    const json = snapshot();
    try { localStorage.setItem(KEY, json); } catch (e) {}
    idbSet(json);
  }
  function normalize(b) {
    return {
      id: String(b.id),
      title: String(b.title || '').slice(0, 200),
      author: String(b.author || ''),
      pages: Math.max(1, parseInt(b.pages) || 1),
      rating: Math.min(10, Math.max(0, parseInt(b.rating) || 0)),
      color: isHex(b.color) ? b.color : '#8b1e1e',
      comment: String(b.comment || ''),
      started: String(b.started || ''),
      finished: String(b.finished || '')
    };
  }
  function applyData(d) {
    if (typeof d.name === 'string' && d.name.trim()) state.name = d.name.trim();
    if (Array.isArray(d.books)) state.books = d.books.filter(b => b && b.id && b.title).map(normalize);
  }
  async function load() {
    let raw = null, fromLocal = false;
    try { raw = localStorage.getItem(KEY); fromLocal = !!raw; } catch (e) {}
    if (!raw) raw = await idbGet();
    if (raw) { try { applyData(JSON.parse(raw)); if (!fromLocal) save(); } catch (e) {} }
  }

  /* ---------- Отрисовка шкафа ---------- */
  const caseEl = $('#case');

  function spineEl(b) {
    const w = thick(b.pages);
    return h('div', {
      class: 'spine', 'data-id': b.id,
      style: `--w:${w}px;--c:${b.color};--t:${textColor(b.color)};--fs:${Math.min(15, Math.max(11, Math.round(w * 0.38)))}px`
    }, h('span', {}, b.title));
  }

  function render() {
    $('#name').textContent = state.name;
    document.title = state.name;
    caseEl.querySelectorAll('.shelf').forEach(n => n.remove());

    const inner = caseEl.clientWidth - 32 - 28;      // боковые стойки и поля полки
    const rows = [[]];
    let used = 0;
    for (const b of state.books) {
      const w = thick(b.pages) + 3;
      if (used + w > inner && rows[rows.length - 1].length) { rows.push([]); used = 0; }
      rows[rows.length - 1].push(b);
      used += w;
    }
    const total = Math.max(rows.length + 2, 6);      // ниже всегда есть пустые полки
    for (let i = 0; i < total; i++) {
      const r = rows[i] || [];
      const row = h('div', { class: 'row' }, r.map(spineEl));
      if (i === 0 && !state.books.length) row.append(h('div', { class: 'hint' }, 'Нажмите «+» и добавьте первую книгу'));
      caseEl.append(h('div', { class: 'shelf', 'data-last': r.length ? r[r.length - 1].id : '' }, row, h('div', { class: 'plank' })));
    }
  }

  /* ---------- Перетаскивание книг ---------- */
  let pending = null, drag = null, ghost = null, raf = 0;
  let pt = { x: 0, y: 0 };

  function moveBook(id, targetId, after) {
    const from = state.books.findIndex(b => b.id === id);
    if (from < 0 || id === targetId) return;
    const [bk] = state.books.splice(from, 1);
    const i = targetId ? state.books.findIndex(b => b.id === targetId) : -1;
    if (i < 0) state.books.push(bk); else state.books.splice(i + (after ? 1 : 0), 0, bk);
    save(); render();
  }
  function swapBooks(a, b) {
    const i = state.books.findIndex(x => x.id === a);
    const j = state.books.findIndex(x => x.id === b);
    if (i < 0 || j < 0 || i === j) return;
    [state.books[i], state.books[j]] = [state.books[j], state.books[i]];
    save(); render();
  }
  function clearMarks() {
    document.querySelectorAll('.mark-before,.mark-after,.mark-swap,.mark-row')
      .forEach(n => n.classList.remove('mark-before', 'mark-after', 'mark-swap', 'mark-row'));
  }
  // Куда упадёт книга: на другую книгу — меняются местами (у края — встаёт рядом), на пустое место полки — в конец этой полки
  function dropTarget() {
    const el = document.elementFromPoint(pt.x, pt.y);
    if (!el) return null;
    const sp = el.closest('.spine');
    if (sp) {
      if (sp === drag.el) return null;
      const r = sp.getBoundingClientRect();
      const rel = (pt.x - r.left) / r.width;
      let mode = 'swap';
      if (r.width >= 30) { if (rel < 0.25) mode = 'before'; else if (rel > 0.75) mode = 'after'; }
      return { type: 'book', el: sp, mode };
    }
    const sh = el.closest('.shelf');
    return sh ? { type: 'shelf', el: sh } : null;
  }
  function updateHover() {
    clearMarks();
    const t = dropTarget();
    if (!t) return;
    t.el.classList.add(t.type === 'book' ? 'mark-' + t.mode : 'mark-row');
  }
  function moveGhost() {
    ghost.style.transform = `translate(${pt.x - drag.w / 2}px, ${pt.y - drag.h / 2}px) scale(1.06) rotate(3deg)`;
  }
  function loop() {
    if (!drag) return;
    const vh = window.innerHeight;
    if (pt.y < 90) window.scrollBy(0, -Math.ceil((90 - pt.y) / 6));
    else if (pt.y > vh - 90) window.scrollBy(0, Math.ceil((pt.y - (vh - 90)) / 6));
    updateHover();
    raf = requestAnimationFrame(loop);
  }
  function beginDrag() {
    const p = pending; clearTimeout(p.timer); pending = null;
    const r = p.el.getBoundingClientRect();
    ghost = p.el.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
    document.body.append(ghost);
    p.el.classList.add('dragging');
    document.body.classList.add('dragging-now');
    drag = { id: p.id, el: p.el, w: r.width, h: r.height };
    if (navigator.vibrate) navigator.vibrate(10);
    moveGhost(); loop();
  }
  function endDrag(drop) {
    const t = drop ? dropTarget() : null;
    clearMarks();
    cancelAnimationFrame(raf);
    ghost.remove(); ghost = null;
    drag.el.classList.remove('dragging');
    document.body.classList.remove('dragging-now');
    const id = drag.id; drag = null;
    if (!t) return;
    if (t.type === 'book') {
      if (t.mode === 'swap') swapBooks(id, t.el.dataset.id);
      else moveBook(id, t.el.dataset.id, t.mode === 'after');
    } else {
      moveBook(id, t.el.dataset.last || null, true);
    }
  }
  function cancelPending() { if (pending) { clearTimeout(pending.timer); pending = null; } }

  function pressStart(el, x, y, type) {
    pt = { x, y };
    pending = { el, id: el.dataset.id, x, y, type, moved: false, timer: null };
    // Пальцем книга «берётся» нажатием на 0,3 секунды, чтобы экран по-прежнему можно было листать
    if (type === 'touch') pending.timer = setTimeout(() => { if (pending) beginDrag(); }, 300);
  }
  function pressMove(x, y) {
    pt = { x, y };
    if (drag) { moveGhost(); return; }
    if (!pending) return;
    if (Math.hypot(x - pending.x, y - pending.y) > 8) {
      pending.moved = true;
      if (pending.type === 'mouse') beginDrag(); else cancelPending();
    }
  }
  function pressEnd(x, y) {
    pt = { x, y };
    if (drag) { endDrag(true); return true; }
    if (pending) {
      const p = pending; cancelPending();
      if (!p.moved) { openDetail(p.id); return true; }
    }
    return false;
  }
  function pressCancel() { if (drag) endDrag(false); cancelPending(); }

  // Касания пальцем (iPhone и iPad)
  caseEl.addEventListener('touchstart', e => {
    const el = e.target.closest && e.target.closest('.spine');
    if (!el || e.touches.length !== 1) return;
    pressStart(el, e.touches[0].clientX, e.touches[0].clientY, 'touch');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pending && !drag) return;
    if (drag && e.cancelable) e.preventDefault();      // пока тащим книгу, экран не листается
    pressMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  document.addEventListener('touchend', e => {
    if (!pending && !drag) return;
    const t = e.changedTouches[0];
    if (pressEnd(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchcancel', pressCancel);

  // Мышь (компьютер)
  caseEl.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const el = e.target.closest('.spine');
    if (el) pressStart(el, e.clientX, e.clientY, 'mouse');
  });
  document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') pressMove(e.clientX, e.clientY); });
  document.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') pressEnd(e.clientX, e.clientY); });

  /* ---------- Окна ---------- */
  function openSheet(...nodes) {
    const sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, nodes);
    const ov = h('div', { class: 'overlay', onclick: e => { if (e.target === ov) close(); } }, sheet);
    const onKey = e => { if (e.key === 'Escape') close(); };
    function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
    document.addEventListener('keydown', onKey);
    document.body.append(ov);
    return close;
  }

  function stars(n) { return '★'.repeat(n) + '☆'.repeat(10 - n); }

  function openDetail(id) {
    const b = state.books.find(x => x.id === id);
    if (!b) return;
    let close;
    const kids = [
      h('div', { class: 'detail-head' },
        h('div', { class: 'preview' }, spineEl(b)),
        h('div', {},
          h('h2', {}, b.title),
          h('div', { class: 'meta' }, `${b.pages} стр.`),
          b.author ? h('div', { class: 'meta' }, `Автор: ${b.author}`) : null)),
      h('div', { class: 'rate' }, stars(b.rating), h('small', {}, `${b.rating}/10`)),
      b.started ? h('div', { class: 'meta' }, `Начал читать: ${fmtDate(b.started)}`) : null,
      b.finished ? h('div', { class: 'meta' }, `Закончил: ${fmtDate(b.finished)}`) : null,
      b.comment ? h('div', { class: 'comment' }, b.comment) : null,
      h('div', { class: 'btns' },
        h('button', { class: 'btn primary', onclick: () => { close(); openForm(b); } }, 'Изменить'),
        h('button', { class: 'btn danger', onclick: () => {
          if (confirm('Убрать эту книгу с полки?')) {
            state.books = state.books.filter(x => x.id !== b.id);
            save(); render(); close();
          }
        } }, 'Убрать с полки'),
        h('button', { class: 'btn', onclick: () => close() }, 'Закрыть'))
    ];
    close = openSheet(kids);
  }

  const SWATCHES = ['#8b1e1e', '#c0392b', '#d9822b', '#e0ad4d', '#d9d4c7', '#2f6b3a', '#1f5f8b', '#2c3e7a', '#5b2a86', '#8a4b2a', '#3a3a3a', '#d65f8c'];

  function openForm(book) {
    const f = book
      ? { ...book, hasStart: !!book.started, hasFinish: !!book.finished, started: book.started || today(), finished: book.finished || today() }
      : { title: '', author: '', pages: '', rating: 0, color: '#8b1e1e', comment: '', hasStart: false, started: today(), hasFinish: false, finished: today() };
    let close;

    const titleIn = h('input', { type: 'text', placeholder: 'Например, Игра престолов', autocomplete: 'off', id: 'f-title' });
    const authorIn = h('input', { type: 'text', placeholder: 'Имя автора', autocomplete: 'off', id: 'f-author' });
    const pagesIn = h('input', { type: 'text', inputmode: 'numeric', pattern: '[0-9]*', placeholder: 'Например, 320', id: 'f-pages' });
    const commentIn = h('textarea', { rows: 4, placeholder: 'Что вы думаете об этой книге?', id: 'f-comment' });
    titleIn.value = f.title; authorIn.value = f.author; pagesIn.value = f.pages; commentIn.value = f.comment;

    const startIn = h('input', { type: 'date' }); startIn.value = f.started;
    const finishIn = h('input', { type: 'date' }); finishIn.value = f.finished;
    const startChk = h('input', { type: 'checkbox' }); startChk.checked = f.hasStart;
    const finishChk = h('input', { type: 'checkbox' }); finishChk.checked = f.hasFinish;

    const starBtns = [];
    const starsRow = h('div', { class: 'stars', role: 'group', 'aria-label': 'Рейтинг от 1 до 10' });
    for (let i = 1; i <= 10; i++) {
      const s = h('button', { type: 'button', 'aria-label': `${i} из 10`, onclick: () => { f.rating = (f.rating === i) ? 0 : i; refresh(); } }, '★');
      starBtns.push(s); starsRow.append(s);
    }

    const colorIn = h('input', { type: 'color', 'aria-label': 'Цвет книги' }); colorIn.value = f.color;
    const swatchRow = h('div', { class: 'swatches' }, SWATCHES.map(c =>
      h('button', { type: 'button', style: `background:${c}`, 'aria-label': `Цвет ${c}`, onclick: () => { f.color = c; colorIn.value = c; refresh(); } })));
    const previewBox = h('div', { class: 'preview' });
    const doneBtn = h('button', { class: 'btn primary', type: 'button' }, 'Закончено');

    function valid() { return f.title.trim().length > 0 && (parseInt(f.pages) || 0) > 0; }
    function refresh() {
      starBtns.forEach((s, i) => s.classList.toggle('on', i < f.rating));
      previewBox.replaceChildren(spineEl({ id: 'preview', title: f.title.trim() || 'Название', pages: parseInt(f.pages) || 200, color: f.color }));
      startIn.style.display = f.hasStart ? '' : 'none';
      finishIn.style.display = f.hasFinish ? '' : 'none';
      doneBtn.toggleAttribute('disabled', !valid());
    }
    titleIn.addEventListener('input', () => { f.title = titleIn.value; refresh(); });
    authorIn.addEventListener('input', () => { f.author = authorIn.value; });
    pagesIn.addEventListener('input', () => { f.pages = pagesIn.value.replace(/\D/g, ''); pagesIn.value = f.pages; refresh(); });
    commentIn.addEventListener('input', () => { f.comment = commentIn.value; });
    startChk.addEventListener('change', () => { f.hasStart = startChk.checked; refresh(); });
    finishChk.addEventListener('change', () => { f.hasFinish = finishChk.checked; refresh(); });
    startIn.addEventListener('change', () => { f.started = startIn.value; });
    finishIn.addEventListener('change', () => { f.finished = finishIn.value; });
    colorIn.addEventListener('input', () => { f.color = colorIn.value; refresh(); });

    doneBtn.addEventListener('click', () => {
      if (!valid()) return;
      const data = normalize({
        id: book ? book.id : uid(),
        title: f.title.trim(), author: f.author.trim(), pages: f.pages, rating: f.rating,
        color: f.color, comment: f.comment.trim(),
        started: f.hasStart ? f.started : '', finished: f.hasFinish ? f.finished : ''
      });
      if (book) Object.assign(book, data); else state.books.push(data);
      save(); render(); close();
    });

    close = openSheet(
      h('h2', {}, book ? 'Изменить книгу' : 'Новая книга'),
      h('div', { class: 'field' }, h('label', { for: 'f-title' }, 'Название книги'), titleIn),
      h('div', { class: 'field' }, h('label', { for: 'f-author' }, 'Автор'), authorIn),
      h('div', { class: 'field' }, h('label', { for: 'f-pages' }, 'Страниц'), pagesIn),
      h('div', { class: 'field' },
        h('label', { class: 'check' }, startChk, 'Начал читать'), startIn,
        h('label', { class: 'check' }, finishChk, 'Закончил читать'), finishIn),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Рейтинг'), starsRow),
      h('div', { class: 'field' },
        h('span', { class: 'lbl' }, 'Цвет книги'),
        h('div', { class: 'colorrow' }, colorIn, h('span', { class: 'meta' }, 'Выберите любой оттенок')),
        swatchRow, previewBox),
      h('div', { class: 'field' }, h('label', { for: 'f-comment' }, 'Комментарий'), commentIn),
      h('div', { class: 'btns' }, doneBtn, h('button', { class: 'btn', type: 'button', onclick: () => close() }, 'Отмена'))
    );
    refresh();
    if (!book) titleIn.focus();
  }

  function openRename() {
    const input = h('input', { type: 'text', placeholder: 'Например, Библиотека Лианы', autocomplete: 'off', maxlength: 60 });
    input.value = state.name;
    let close;
    const saveName = () => {
      const t = input.value.trim();
      if (t) { state.name = t; save(); render(); }
      close();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });
    close = openSheet(
      h('h2', {}, 'Название библиотеки'),
      h('div', { class: 'field' }, input),
      h('div', { class: 'btns' },
        h('button', { class: 'btn primary', onclick: saveName }, 'Сохранить'),
        h('button', { class: 'btn', onclick: () => close() }, 'Отмена'))
    );
    input.focus(); input.select();
  }

  function openBackup() {
    let close;
    const ta = h('textarea', { rows: 4, placeholder: 'Вставьте сюда сохранённую копию, чтобы восстановить книги' });
    const fileIn = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    const pretty = () => JSON.stringify({ v: 1, name: state.name, books: state.books }, null, 1);

    function restore(text) {
      try {
        const d = JSON.parse(text);
        if (!d || !Array.isArray(d.books)) throw new Error('bad');
        if (!confirm(`Заменить текущие книги копией (${d.books.length} шт.)?`)) return;
        applyData(d); save(); render(); close();
      } catch (e) { alert('Не удалось прочитать копию. Проверьте, что вставлен весь текст.'); }
    }
    fileIn.addEventListener('change', () => {
      const file = fileIn.files[0];
      if (file) file.text().then(restore);
    });

    close = openSheet(
      h('h2', {}, 'Резервная копия'),
      h('p', { class: 'note' }, `Книги уже сохраняются на этом устройстве автоматически (сейчас их ${state.books.length}). Копия нужна на случай, если вы очистите данные браузера или смените устройство.`),
      h('div', { class: 'btns', style: 'margin-top:0' },
        h('button', { class: 'btn primary', onclick: () => {
          const url = URL.createObjectURL(new Blob([pretty()], { type: 'application/json' }));
          const a = h('a', { href: url, download: 'библиотека.json' });
          document.body.append(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } }, 'Скачать копию файлом'),
        h('button', { class: 'btn', onclick: async () => {
          try { await navigator.clipboard.writeText(pretty()); alert('Копия скопирована. Вставьте её в заметки.'); }
          catch (e) { ta.value = pretty(); ta.select(); alert('Скопируйте текст из поля ниже вручную.'); }
        } }, 'Скопировать копию текстом')),
      h('div', { class: 'field', style: 'margin-top:18px' }, h('span', { class: 'lbl' }, 'Восстановить'), ta),
      h('div', { class: 'btns', style: 'margin-top:0' },
        h('button', { class: 'btn', onclick: () => restore(ta.value) }, 'Восстановить из текста'),
        h('button', { class: 'btn', onclick: () => fileIn.click() }, 'Выбрать файл копии'),
        h('button', { class: 'btn', onclick: () => close() }, 'Закрыть')),
      fileIn
    );
  }

  /* ---------- Кнопки ---------- */
  $('#addBtn').addEventListener('click', () => openForm(null));
  $('#nameBtn').addEventListener('click', openRename);
  $('#backupBtn').addEventListener('click', openBackup);

  /* ---------- Иконка для экрана «Домой» ---------- */
  function makeIcon() {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 180;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 0, 180);
      g.addColorStop(0, '#5a3a22'); g.addColorStop(1, '#2b1809');
      x.fillStyle = g; x.fillRect(0, 0, 180, 180);
      const books = [['#8b1e1e', 22, 86], ['#d9d4c7', 34, 70], ['#1f5f8b', 28, 100], ['#e0ad4d', 24, 62], ['#2f6b3a', 30, 92]];
      let px = 16;
      for (const [col, w, hh] of books) { x.fillStyle = col; x.fillRect(px, 140 - hh, w, hh); px += w + 3; }
      x.fillStyle = '#b8794a'; x.fillRect(10, 140, 160, 14);
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
      document.head.append(l);
    } catch (e) {}
  }

  /* ---------- Запуск ---------- */
  let lastW = 0;
  window.addEventListener('resize', () => {
    if (drag || window.innerWidth === lastW) return;
    lastW = window.innerWidth; render();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  window.addEventListener('pagehide', save);

  (async () => {
    makeIcon();
    await load();
    lastW = window.innerWidth;
    render();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  })();
})();
</script>
</body>
</html>
